<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b4079">
    <script>(function(){try{var t=localStorage.getItem('toris-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#1b4079');}catch(e){}})();</script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TorisApp">
    <title>TorisApp</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/shared.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-booting">
<a href="#main-content" class="skip-link">Saltar al contenido</a>
<div id="boot-splash" role="status" aria-live="polite">Cargando…</div>

<!-- SCREEN: LOGIN -->
<div id="screen-login" class="screen">
    <button type="button" class="btn-icon" data-theme-toggle onclick="toggleTheme()" aria-label="Modo oscuro" style="position:fixed;top:16px;right:16px;z-index:10"><i data-icon="moon" data-size="18"></i></button>
    <div class="login-card">
        <div class="login-logo"><i data-icon="cube-transparent" data-size="48"></i></div>
        <h1>TorisApp</h1>
        <p>Círculos compartidos: gastos, listas y tareas</p>
        <button type="button" class="btn-google" onclick="iniciarSesion()">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continuar con Google
        </button>
    </div>
</div>

<!-- TOPBAR -->
<div id="topbar" class="topbar hidden">
    <div class="topbar-left">
        <h1><i data-icon="cube-transparent" data-size="20"></i> Mis círculos</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <span id="topbar-user" class="topbar-user"></span>
        <button type="button" class="btn-icon" data-theme-toggle onclick="toggleTheme()" aria-label="Modo oscuro"><i data-icon="moon" data-size="18"></i></button>
        <button type="button" class="btn-icon" onclick="cerrarSesion()" aria-label="Cerrar sesión"><i data-icon="arrow-right-on-rectangle" data-size="18"></i></button>
    </div>
</div>

<!-- SCREEN: CÍRCULOS -->
<div id="screen-dashboard" class="screen">
    <main id="main-content" class="container">
        <div id="lista-grupos"><div class="loader" role="status" aria-live="polite">Cargando círculos…</div></div>
        <button type="button" class="btn btn-primary btn-full mt-16" onclick="abrirModalGrupo()"><i data-icon="plus" data-size="16"></i> Nuevo círculo</button>
        <div id="seccion-accesos" class="mt-16">
            <div id="lista-accesos"></div>
        </div>
    </main>
</div>

<!-- MODAL: NUEVO CÍRCULO -->
<div id="modal-grupo" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-grupo-title">Nuevo círculo</h3>
            <button type="button" class="modal-close" onclick="cerrarModal('modal-grupo')" aria-label="Cerrar"><i data-icon="x-mark" data-size="14"></i></button>
        </div>
        <div class="form-group">
            <label for="input-nombre-grupo">Nombre</label>
            <input type="text" id="input-nombre-grupo" name="nombre_grupo" placeholder="Ej: Hogar, viaje con los chicos…" autocomplete="off" />
        </div>
        <button type="button" class="btn btn-primary btn-full" onclick="crearGrupo()">Crear círculo</button>
    </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script>
    async function iniciarSesion() {
        const { error } = await db.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: APP_BASE_URL }
        });
        if (error) alert('Error al iniciar sesión: ' + error.message);
    }

    async function cerrarSesion() {
        try { localStorage.removeItem('toris-last-route'); } catch (_) {}
        _appActivada = false;
        await db.auth.signOut();
    }

    let _appLista = false;
    let _appActivada = false;
    let _cargarGruposSeq = 0;

    db.auth.onAuthStateChange(async (event, session) => {
        if (session) await guardarTokenGoogleIfPresent(session);
        if (event === 'INITIAL_SESSION') {
            _appLista = true;
            if (session) await activarApp(session.user);
            else {
                mostrarPantalla('login');
                document.getElementById('topbar').classList.add('hidden');
                appReady();
            }
            return;
        }
        if (session && (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED')) {
            await activarApp(session.user);
        } else if (event === 'SIGNED_OUT') {
            _appActivada = false;
            mostrarPantalla('login');
            document.getElementById('topbar').classList.add('hidden');
            appReady();
        }
    });

    async function activarApp(user) {
        if (_appActivada) return;
        _appActivada = true;
        window._indexUserId = user.id;
        document.getElementById('topbar').classList.remove('hidden');
        const nombre = (user.user_metadata?.full_name || user.email || '').split(' ')[0];
        document.getElementById('topbar-user').textContent = nombre;

        const params = new URLSearchParams(window.location.search);
        const invite = params.get('invite') || params.get('invite_gasto') || params.get('invite_tarea');
        if (invite) {
            window.location.href = `./circulo.html?abrir=${invite}`;
            return;
        }

        mostrarPantalla('dashboard');
        appReady();
        syncInvitados().catch(() => {});
        pintarAccesosEnIndex(user.id).catch(() => {});
        await cargarGrupos();
    }

    function mostrarPantalla(nombre) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + nombre).classList.add('active');
    }

    function abrirModalGrupo(grupo = null) {
        if (!window._gm) window._gm = crearGestorDeGrupos({ table: 'circulos', nameField: 'nombre', rpcCreate: 'crear_circulo' });
        window._gm.abrirModalGrupo(grupo);
    }

    async function crearGrupo() {
        if (!window._gm) window._gm = crearGestorDeGrupos({ table: 'circulos', nameField: 'nombre', rpcCreate: 'crear_circulo' });
        const grupo = await window._gm.crearGrupo();
        if (grupo?.id) irAlCirculo(grupo.id);
    }

    async function editarGrupo(id) {
        const { data, error } = await db.from('circulos').select('*').eq('id', id).single();
        if (error) { alert('Error: ' + error.message); return; }
        abrirModalGrupo(data);
    }

    async function eliminarGrupo(id, nombre) {
        if (!(await torisConfirm({
            title: 'Eliminar círculo',
            message: `¿Eliminar el círculo "${nombre}"?\nSe borrarán periodos, gastos, listas, tareas y personas.`,
            confirmLabel: 'Eliminar',
            danger: true
        }))) return;
        const { error } = await db.from('circulos').delete().eq('id', id);
        if (error) { alert('Error: ' + error.message); return; }
        cargarGrupos();
    }

    async function cargarGrupos() {
        const cont = document.getElementById('lista-grupos');
        if (!cont) return;
        const seq = ++_cargarGruposSeq;
        try {
            cont.innerHTML = typeof loaderHtml === 'function'
                ? loaderHtml('Cargando círculos…')
                : '<div class="loader" role="status" aria-live="polite">Cargando círculos…</div>';
            const { data, error } = await db.from('circulos').select('*').order('created_at', { ascending: false });
            if (seq !== _cargarGruposSeq) return;
            if (error) {
                cont.innerHTML = `<div class="alert alert-error">Error al cargar círculos: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!data?.length) {
                cont.innerHTML = `<div class="empty"><span class="empty-icon"><i data-icon="users" data-size="40"></i></span>Sin círculos todavía.<br>Creá uno para empezar (ej: Hogar).</div>`;
                return;
            }
            cont.innerHTML = data.map(g => `
            <div class="card card-click" onclick="irAlCirculo(${g.id})">
                <div class="card-body flex-between" style="gap:10px">
                    <div style="flex:1;min-width:0">
                        <div style="font-weight:700;font-size:16px">${escapeHtml(g.nombre)}</div>
                        <div class="text-muted">${new Date(g.created_at).toLocaleDateString('es-AR', { day:'2-digit', month:'short', year:'numeric' })}</div>
                    </div>
                    <div class="card-actions" onclick="event.stopPropagation()">
                        <button type="button" class="btn btn-ghost btn-sm" onclick="editarGrupo(${g.id})" aria-label="Editar">${icon('pencil-square',16)}</button>
                        <button type="button" class="btn btn-danger btn-sm" onclick="eliminarGrupo(${g.id}, '${escapeJsString(g.nombre)}')" aria-label="Eliminar">${icon('trash',16)}</button>
                    </div>
                </div>
            </div>
        `).join('');
        } catch (e) {
            if (seq !== _cargarGruposSeq) return;
            cont.innerHTML = `<div class="alert alert-error">No se pudieron cargar los círculos.<br>${escapeHtml(e?.message || String(e))}</div>`;
        }
    }

    function escapeJsString(value) {
        return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    async function bootIndexAuth() {
        if (_appLista) return;
        let session = (await db.auth.getSession()).data.session;
        if (!session) {
            session = await new Promise(resolve => {
                let sub = null;
                const timeout = setTimeout(() => {
                    if (sub) sub.unsubscribe();
                    resolve(null);
                }, 5000);
                const { data: { subscription } } = db.auth.onAuthStateChange((event, s) => {
                    if (event === 'INITIAL_SESSION' || s) {
                        clearTimeout(timeout);
                        subscription.unsubscribe();
                        resolve(s || null);
                    }
                });
                sub = subscription;
            });
        }
        if (_appLista) return;
        if (session) await activarApp(session.user);
        else {
            mostrarPantalla('login');
            document.getElementById('topbar').classList.add('hidden');
            appReady();
        }
    }

    bootIndexAuth();
</script>
</body>
</html>
