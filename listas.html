<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b4079">
    <script>(function(){try{var t=localStorage.getItem('toris-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#1b4079');}catch(e){}})();</script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TorisApp">
    <title>TorisApp • Listas</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/shared.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-booting">
<div id="boot-splash">Cargando...</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button id="btn-back" class="btn-icon" onclick="volverAListas()"><i data-icon="arrow-left" data-size="18"></i></button>
        <h1 id="topbar-title"><i data-icon="shopping-cart" data-size="20"></i> Listas</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <span id="topbar-user" class="topbar-user"></span>
        <button class="btn-icon" data-theme-toggle onclick="toggleTheme()" title="Modo oscuro"><i data-icon="moon" data-size="18"></i></button>
        <button class="btn-icon" onclick="cerrarSesion()" title="Cerrar sesión"><i data-icon="arrow-right-on-rectangle" data-size="18"></i></button>
    </div>
</div>

<!-- SCREEN: LISTA DE LISTAS -->
<div id="screen-listas" class="screen active">
    <div class="container">
        <div id="lista-de-listas"><div class="loader">Cargando listas...</div></div>
        <button class="btn btn-primary btn-full mt-16" onclick="abrirModalLista()"><i data-icon="plus" data-size="16"></i> Nueva Lista</button>
        <button class="btn btn-ghost btn-full mt-12" onclick="abrirModalPlantillas()"><i data-icon="clipboard-document-list" data-size="16"></i> Cargar plantilla</button>
    </div>
</div>

<!-- SCREEN: DETALLE DE LISTA -->
<div id="screen-detalle" class="screen">
    <div class="container">
        <div class="filter-tabs" id="lista-filters">
            <div class="filter-tab active" onclick="setFiltro('pendientes')">Pendientes</div>
            <div class="filter-tab" onclick="setFiltro('todos')">Todos</div>
            <div class="filter-tab" onclick="setFiltro('comprados')">Comprados</div>
        </div>
        <div id="lista-stats" class="stats-row"></div>
        <div id="lista-items" class="card"></div>

        <div class="add-item-form mt-12">
            <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Agregar ítem</div>
            <div class="form-group" style="margin-bottom:8px">
                <input type="text" id="lista-input-nombre" placeholder="Ej: Leche, Fideos, Jabón..." class="input-sm"
                    onkeydown="if(event.key==='Enter') agregarItem()" />
            </div>
            <div class="add-item-row">
                <input type="number" id="lista-input-cantidad" placeholder="Cant." class="input-sm" style="width:80px" min="0" step="0.5" />
                <select id="lista-input-unidad" class="input-sm" style="flex:1">
                    <option value="">sin unidad</option>
                    <option value="kg">kg</option>
                    <option value="g">g</option>
                    <option value="L">L</option>
                    <option value="ml">ml</option>
                    <option value="u">u (unidades)</option>
                    <option value="paq">paq</option>
                    <option value="doc">docena</option>
                </select>
                <button class="btn btn-primary" onclick="agregarItem()" style="white-space:nowrap"><i data-icon="plus" data-size="16"></i> Agregar</button>
            </div>
        </div>

        <div id="acciones-comprados" class="mt-12" style="display:none;gap:8px">
            <button class="btn btn-ghost" id="btn-desmarcar-comprados" onclick="desmarcarComprados()" style="flex:0 0 20%;max-width:20%;padding:10px 4px;font-size:12px" title="Desmarcar todos los comprados">
                <i data-icon="arrow-path-rounded-square" data-size="16"></i>
            </button>
            <button class="btn btn-primary" id="btn-cargar-gastos" onclick="abrirModalCargarGastos()" style="flex:1 1 80%;min-width:0">
                <i data-icon="currency-dollar" data-size="16"></i> Cargar a gastos
            </button>
        </div>
    </div>
</div>

<!-- MODAL: NUEVA LISTA -->
<div id="modal-lista" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>Nueva Lista</h3>
            <button class="modal-close" onclick="cerrarModal('modal-lista')"><i data-icon="x-mark" data-size="14"></i></button>
        </div>
        <div class="form-group">
            <label>Nombre de la lista</label>
            <input type="text" id="input-nombre-lista" placeholder="Ej: Supermercado, Viaje a Bariloche..." />
        </div>
        <button class="btn btn-primary btn-full" onclick="crearLista()">Crear Lista</button>
    </div>
</div>

<!-- MODAL: PLANTILLAS -->
<div id="modal-plantillas" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>Cargar plantilla</h3>
            <button class="modal-close" onclick="cerrarModal('modal-plantillas')"><i data-icon="x-mark" data-size="14"></i></button>
        </div>
        <p class="text-muted" style="margin-bottom:14px;font-size:13px;line-height:1.45">
            Crea una lista nueva con ítems prearmados. Podés editarla después.
        </p>
        <div id="lista-plantillas"></div>
    </div>
</div>

<!-- MODAL: CARGAR COMPRADOS A GASTOS -->
<div id="modal-cargar-gastos" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3>Cargar a gastos</h3>
            <button class="modal-close" onclick="cerrarModal('modal-cargar-gastos')"><i data-icon="x-mark" data-size="14"></i></button>
        </div>
        <div id="cargar-gastos-resumen" class="text-muted" style="margin-bottom:14px;font-size:13px;line-height:1.45"></div>
        <div class="form-group">
            <label>Periodo</label>
            <select id="cg-periodo"></select>
        </div>
        <div class="form-group">
            <label>Concepto</label>
            <input type="text" id="cg-concepto" placeholder="Ej: Compra del sábado…" />
        </div>
        <div class="form-group">
            <label>Fecha del gasto</label>
            <input type="date" id="cg-fecha" />
        </div>
        <div class="form-group">
            <label>Monto total ($)</label>
            <input type="text" id="cg-monto" class="input-monto" placeholder="Total del ticket" inputmode="decimal" autocomplete="off" />
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <select id="cg-tipo"></select>
        </div>
        <div class="form-group">
            <label>¿Quién pagó?</label>
            <select id="cg-pagador"></select>
        </div>
        <div class="form-group">
            <label>División por persona ($)</label>
            <div style="display:flex;gap:8px;margin-bottom:10px">
                <button type="button" class="btn btn-ghost btn-sm" onclick="cgRepartirIgual()">Partes iguales</button>
                <button type="button" class="btn btn-ghost btn-sm" onclick="cgLimpiarSplit()">Limpiar</button>
            </div>
            <div id="cg-split-container"></div>
            <div id="cg-split-total-row" class="split-total-row"></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="guardarCargarGastos()">Guardar gasto</button>
    </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/listas-plantillas.js"></script>
<script>
// =============================================
// ESTADO GLOBAL
// =============================================
let circuloId = null;
let circuloActual = null;
let listaActual = null;
let filtroLista = 'pendientes';
let todosLosItems = [];
let participantesCirculo = [];
let periodosCirculo = [];

const CATEGORIAS_DEFECTO = [
    { nombre: 'Super', icono: 'shopping-cart' },
    { nombre: 'Carnicería', icono: 'cake' },
    { nombre: 'Verdulería', icono: 'shopping-bag' },
    { nombre: 'Gatos', icono: 'heart' },
    { nombre: 'Casa alquiler', icono: 'home' },
    { nombre: 'Casa impuestos', icono: 'bolt' },
    { nombre: 'Tarjetas', icono: 'credit-card' },
    { nombre: 'Auto', icono: 'truck' },
    { nombre: 'Viajes', icono: 'paper-airplane' },
    { nombre: 'Salidas', icono: 'film' },
    { nombre: 'Otros', icono: 'archive-box' }
];

requireAuth(async () => {
    await syncInvitados({ personsTable: 'participantes', personGroupField: 'id_circulo', membershipTable: 'circulos_miembros', membershipGroupField: 'id_circulo' });

    const params = new URLSearchParams(window.location.search);
    let circuloParam = params.get('circulo');
    const abrirId = params.get('abrir');

    if (!circuloParam && abrirId) {
        const { data } = await db.from('listas').select('id_circulo').eq('id', abrirId).single();
        if (data?.id_circulo) {
            circuloParam = String(data.id_circulo);
            setQueryParam('circulo', circuloParam);
        }
    }

    if (!circuloParam) {
        window.location.href = './index.html';
        return;
    }

    circuloId = parseInt(circuloParam, 10);
    const { data: circulo, error } = await db.from('circulos').select('*').eq('id', circuloId).single();
    if (error || !circulo) {
        alert('No se encontró ese círculo.');
        window.location.href = './index.html';
        return;
    }
    circuloActual = circulo;
    setQueryParams({ circulo: circuloId });

    if (abrirId) {
        bootScreen('detalle');
        appReady();
        await abrirListaPorId(parseInt(abrirId, 10), { filtro: params.get('filtro') });
    } else {
        bootScreen('listas');
        actualizarTopbarListas();
        setQueryParams({ circulo: circuloId, abrir: null, filtro: null });
        appReady();
        await cargarListas();
    }
});

const FILTROS_LISTA = ['pendientes', 'todos', 'comprados'];

async function abrirListaPorId(id, opts = {}) {
    const { data, error } = await db.from('listas').select('*').eq('id', id).single();
    if (error || !data) {
        alert('No se encontró esa lista.');
        clearListaDetailParams();
        await cargarListas();
        mostrarPantalla('listas');
        return;
    }
    if (data.id_circulo !== circuloId) {
        alert('Esa lista no pertenece a este círculo.');
        clearListaDetailParams();
        await cargarListas();
        mostrarPantalla('listas');
        return;
    }
    await abrirLista(data, opts);
}

function clearListaDetailParams() {
    setQueryParams({ abrir: null, filtro: null, circulo: circuloId });
}

function actualizarTopbarListas() {
    if (listaActual) {
        document.getElementById('topbar-title').textContent = listaActual.nombre;
    } else {
        document.getElementById('topbar-title').textContent = circuloActual?.nombre || 'Listas';
    }
}

// =============================================
// NAVEGACIÓN
// =============================================
function mostrarPantalla(nombre) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + nombre).classList.add('active');
}

function volverAListas() {
    if (listaActual) {
        listaActual = null;
        clearListaDetailParams();
        actualizarTopbarListas();
        mostrarPantalla('listas');
        cargarListas();
        return;
    }
    irAlCirculo(circuloId);
}

// =============================================
// LISTA DE LISTAS (las "carpetas": Supermercado, Viaje, etc.)
// =============================================
async function cargarListas() {
    const cont = document.getElementById('lista-de-listas');
    cont.innerHTML = '<div class="loader">Cargando listas...</div>';
    const { data, error } = await db.from('listas').select('*').eq('id_circulo', circuloId).order('created_at', { ascending: false });
    if (error) { cont.innerHTML = `<div class="alert alert-error">Error: ${error.message}<br>¿Ejecutaste el SQL de configuración? Ver README.</div>`; return; }
    if (!data?.length) {
        cont.innerHTML = `<div class="empty"><span class="empty-icon"><i data-icon="shopping-cart" data-size="40"></i></span>Sin listas todavía.<br>Creá una para empezar.</div>`;
        return;
    }
    cont.innerHTML = data.map(l => `
        <div class="card card-click" onclick='abrirLista(${JSON.stringify(l)})'>
            <div class="card-body flex-between" style="gap:10px">
                <div style="flex:1;min-width:0">
                    <div style="font-weight:700;font-size:16px">${escapeHtml(l.nombre)}</div>
                    <div class="text-muted">${new Date(l.created_at).toLocaleDateString('es-AR', { day:'2-digit', month:'short', year:'numeric' })}</div>
                </div>
                <div class="card-actions" onclick="event.stopPropagation()">
                    <button class="btn btn-danger btn-sm" onclick="eliminarLista(${l.id}, '${l.nombre.replace(/'/g,"\\'")}')">${icon('trash',16)}</button>
                </div>
            </div>
        </div>
    `).join('');
}

function abrirModalLista() {
    document.getElementById('input-nombre-lista').value = '';
    abrirModal('modal-lista');
    setTimeout(() => document.getElementById('input-nombre-lista').focus(), 100);
}

async function crearLista() {
    await withBusyButton('#modal-lista .btn-primary', async () => {
        const nombre = document.getElementById('input-nombre-lista').value.trim();
        if (!nombre) { alert('Ingresá un nombre.'); return; }
        const { error } = await db.from('listas').insert({ nombre, id_circulo: circuloId });
        if (error) { alert('Error: ' + error.message); return; }
        document.getElementById('input-nombre-lista').value = '';
        cerrarModal('modal-lista');
        cargarListas();
    });
}

function abrirModalPlantillas() {
    const cont = document.getElementById('lista-plantillas');
    cont.innerHTML = (typeof LISTAS_PLANTILLAS !== 'undefined' ? LISTAS_PLANTILLAS : []).map(p => `
        <div class="card card-click" style="margin-bottom:8px" onclick="cargarPlantilla('${escapeJsString(p.id)}')">
            <div class="card-body dash-card" style="padding:14px 12px">
                <div class="dash-icon" style="width:40px;height:40px"><i data-icon="${p.icon || 'clipboard-document-list'}" data-size="22"></i></div>
                <div style="min-width:0;flex:1">
                    <div class="dash-title" style="font-size:15px">${escapeHtml(p.nombre)}</div>
                    <div class="dash-sub">${p.items.length} ítems</div>
                </div>
                <div class="dash-arrow">›</div>
            </div>
        </div>
    `).join('') || `<div class="text-muted">No hay plantillas disponibles.</div>`;
    abrirModal('modal-plantillas');
}

async function cargarPlantilla(plantillaId) {
    const plantilla = (LISTAS_PLANTILLAS || []).find(p => p.id === plantillaId);
    if (!plantilla) return;
    if (window._cargandoPlantilla) return;
    window._cargandoPlantilla = true;

    const cont = document.getElementById('lista-plantillas');
    const prev = cont.innerHTML;
    cont.innerHTML = `<div class="loader">Creando "${escapeHtml(plantilla.nombre)}"…</div>`;

    try {
        const { data: lista, error } = await db.from('listas')
            .insert({ nombre: plantilla.nombre, id_circulo: circuloId })
            .select()
            .single();
        if (error || !lista) {
            alert('Error al crear la lista: ' + (error?.message || 'desconocido'));
            cont.innerHTML = prev;
            return;
        }

        const rows = plantilla.items.map(nombre => ({
            nombre,
            id_lista: lista.id,
            comprado: false
        }));

        const chunk = 80;
        for (let i = 0; i < rows.length; i += chunk) {
            const slice = rows.slice(i, i + chunk);
            const { error: ei } = await db.from('lista_compras').insert(slice);
            if (ei) {
                alert('La lista se creó, pero falló al cargar algunos ítems: ' + ei.message);
                break;
            }
        }

        cerrarModal('modal-plantillas');
        await abrirLista(lista);
    } finally {
        window._cargandoPlantilla = false;
    }
}

async function eliminarLista(id, nombre) {
    if (!confirm(`¿Eliminar la lista "${nombre}"?\nSe borrarán todos sus ítems.`)) return;
    const { error: ei } = await db.from('lista_compras').delete().eq('id_lista', id);
    if (ei) { alert('Error al borrar ítems: ' + ei.message); return; }
    const { error: el } = await db.from('listas').delete().eq('id', id);
    if (el) { alert('Error al borrar lista: ' + el.message); return; }
    cargarListas();
}

async function abrirLista(lista, opts = {}) {
    listaActual = lista;
    const filtro = FILTROS_LISTA.includes(opts.filtro) ? opts.filtro : 'pendientes';
    setQueryParams({ circulo: circuloId, abrir: lista.id, filtro });
    document.getElementById('topbar-title').textContent = lista.nombre;
    mostrarPantalla('detalle');
    await cargarItems();
    setFiltro(filtro);
}

// =============================================
// ÍTEMS DE LA LISTA ACTUAL
// =============================================
function setFiltro(f) {
    filtroLista = f;
    document.querySelectorAll('.filter-tab').forEach((t, i) => {
        t.classList.toggle('active', ['pendientes','todos','comprados'][i] === f);
    });
    if (listaActual) setQueryParams({ circulo: circuloId, abrir: listaActual.id, filtro: f });
    renderItems();
}

async function cargarItems() {
    const cont = document.getElementById('lista-items');
    cont.innerHTML = '<div class="loader">Cargando...</div>';
    const { data, error } = await db.from('lista_compras')
        .select('*').eq('id_lista', listaActual.id).order('comprado').order('created_at');
    if (error) { cont.innerHTML = `<div class="alert alert-error">${error.message}</div>`; return; }
    todosLosItems = data || [];
    renderItems();
}

function renderItems() {
    const cont = document.getElementById('lista-items');
    const pendientes = todosLosItems.filter(i => !i.comprado);
    const comprados  = todosLosItems.filter(i => i.comprado);

    let items;
    if (filtroLista === 'pendientes') items = pendientes;
    else if (filtroLista === 'comprados') items = comprados;
    else items = [...pendientes, ...comprados];

    document.getElementById('lista-stats').innerHTML =
        `<span>${pendientes.length} pendiente${pendientes.length !== 1 ? 's' : ''}</span>
         <span>${comprados.length} comprado${comprados.length !== 1 ? 's' : ''}</span>`;

    const acciones = document.getElementById('acciones-comprados');
    if (acciones) {
        acciones.style.display = (filtroLista === 'comprados' && comprados.length > 0) ? 'flex' : 'none';
    }

    if (!items.length) {
        const msgs = { pendientes: '<i data-icon="check-circle" data-size="18"></i> No hay ítems pendientes.', comprados: 'Sin ítems comprados todavía.', todos: '<i data-icon="clipboard-document-list" data-size="18"></i> La lista está vacía. Agregá algo.' };
        cont.innerHTML = `<div class="empty" style="padding:24px"><span class="empty-icon">${filtroLista === 'pendientes' ? icon('check-circle',40) : icon('shopping-cart',40)}</span>${msgs[filtroLista]}</div>`;
        return;
    }

    cont.innerHTML = items.map(item => {
        const cantStr = item.cantidad ? `${item.cantidad}${item.unidad ? ' ' + item.unidad : ''}` : '';
        return `<div class="lista-item ${item.comprado ? 'comprado' : ''}" id="item-${item.id}">
            <div class="lista-check ${item.comprado ? 'checked' : ''}" onclick="toggleItem(${item.id}, ${item.comprado})">
                ${item.comprado ? icon('check',14) : ''}
            </div>
            <div class="lista-nombre ${item.comprado ? 'tachado' : ''}">${escapeHtml(item.nombre)}</div>
            ${cantStr ? `<div class="lista-cantidad">${escapeHtml(cantStr)}</div>` : ''}
            <button onclick="borrarItem(${item.id})" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:4px;flex-shrink:0"><i data-icon="x-mark" data-size="14"></i></button>
        </div>`;
    }).join('');
}

async function agregarItem() {
    const nombre   = document.getElementById('lista-input-nombre').value.trim();
    const cantidad = parseFloat(document.getElementById('lista-input-cantidad').value) || null;
    const unidad   = document.getElementById('lista-input-unidad').value || null;
    if (!nombre) { document.getElementById('lista-input-nombre').focus(); return; }

    const payload = { nombre, cantidad, unidad, id_lista: listaActual.id };
    const { data, error } = await db.from('lista_compras').insert(payload).select().single();
    if (error) { alert('Error: ' + error.message); return; }

    document.getElementById('lista-input-nombre').value = '';
    document.getElementById('lista-input-cantidad').value = '';
    document.getElementById('lista-input-unidad').value = '';
    document.getElementById('lista-input-nombre').focus();

    todosLosItems = [data, ...todosLosItems];
    todosLosItems.sort((a, b) => a.comprado - b.comprado || new Date(a.created_at) - new Date(b.created_at));
    renderItems();
}

async function toggleItem(id, estaComprado) {
    const nuevoEstado = !estaComprado;
    const { error } = await db.from('lista_compras').update({
        comprado: nuevoEstado,
        comprado_at: nuevoEstado ? new Date().toISOString() : null
    }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    const item = todosLosItems.find(i => i.id === id);
    if (item) { item.comprado = nuevoEstado; item.comprado_at = nuevoEstado ? new Date().toISOString() : null; }
    renderItems();
}

async function borrarItem(id) {
    const { error } = await db.from('lista_compras').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    todosLosItems = todosLosItems.filter(i => i.id !== id);
    renderItems();
}

async function desmarcarComprados() {
    const comprados = todosLosItems.filter(i => i.comprado);
    if (!comprados.length) return;
    if (!confirm(`¿Desmarcar ${comprados.length} ítem${comprados.length === 1 ? '' : 's'}? Vuelven a pendientes.`)) return;
    const ids = comprados.map(i => i.id);
    const { error } = await db.from('lista_compras')
        .update({ comprado: false, comprado_at: null })
        .in('id', ids);
    if (error) { alert('Error: ' + error.message); return; }
    todosLosItems.forEach(i => {
        if (ids.includes(i.id)) {
            i.comprado = false;
            i.comprado_at = null;
        }
    });
    renderItems();
}

// =============================================
// CARGAR COMPRADOS → GASTO
// =============================================
function categoriasParaGasto() {
    // Defaults de la app + custom del círculo (sin duplicar por nombre)
    const byName = new Map();
    CATEGORIAS_DEFECTO.forEach(c => {
        byName.set(String(c.nombre).toLowerCase(), { nombre: c.nombre, icono: c.icono || 'archive-box' });
    });
    const raw = circuloActual?.categorias;
    if (Array.isArray(raw)) {
        raw.forEach(c => {
            const item = typeof c === 'string'
                ? { nombre: c }
                : { nombre: c?.nombre || c?.name, icono: c?.icono || c?.icon };
            if (!item.nombre) return;
            const key = String(item.nombre).toLowerCase();
            if (!byName.has(key)) {
                byName.set(key, { nombre: item.nombre, icono: item.icono || 'archive-box' });
            } else if (item.icono) {
                const prev = byName.get(key);
                byName.set(key, { nombre: prev.nombre, icono: item.icono });
            }
        });
    }
    return [...byName.values()];
}

async function asegurarDatosGasto() {
    // Siempre refrescar: si no, periodos/personas/categorías quedan viejos
    const [{ data: partes, error: ep }, { data: periodos, error: eo }, { data: circulo, error: ec }] = await Promise.all([
        db.from('participantes').select('*').eq('id_circulo', circuloId).order('id'),
        db.from('periodos').select('id, nombre, created_at').eq('id_circulo', circuloId).order('created_at', { ascending: false }),
        db.from('circulos').select('id, nombre, categorias').eq('id', circuloId).single()
    ]);
    if (ep) throw new Error(ep.message);
    if (eo) throw new Error(eo.message);
    if (ec) throw new Error(ec.message);
    participantesCirculo = partes || [];
    periodosCirculo = periodos || [];
    if (circulo && circuloActual) {
        circuloActual.categorias = circulo.categorias;
        if (circulo.nombre) circuloActual.nombre = circulo.nombre;
    }
}

async function abrirModalCargarGastos() {
    const comprados = todosLosItems.filter(i => i.comprado);
    if (!comprados.length) {
        alert('No hay ítems comprados para cargar.');
        return;
    }
    try {
        await asegurarDatosGasto();
    } catch (e) {
        alert('Error al preparar el gasto: ' + e.message);
        return;
    }
    if (!periodosCirculo.length) {
        alert('No hay periodos en este círculo. Creá uno en Gastos primero.');
        return;
    }
    if (!participantesCirculo.length) {
        alert('Agregá personas al círculo antes de cargar un gasto.');
        return;
    }

    const nombres = comprados.map(i => i.nombre);
    const preview = nombres.length <= 4
        ? nombres.join(', ')
        : `${nombres.slice(0, 3).join(', ')} y ${nombres.length - 3} más`;
    document.getElementById('cargar-gastos-resumen').innerHTML =
        `<strong>${comprados.length} ítem${comprados.length === 1 ? '' : 's'} comprado${comprados.length === 1 ? '' : 's'}</strong><br>${escapeHtml(preview)}`;

    const selPeriodo = document.getElementById('cg-periodo');
    selPeriodo.innerHTML = periodosCirculo.map(p =>
        `<option value="${p.id}">${escapeHtml(p.nombre)}</option>`
    ).join('');

    document.getElementById('cg-concepto').value = listaActual?.nombre || '';
    document.getElementById('cg-fecha').value = hoyISO();
    setMontoInput(document.getElementById('cg-monto'), NaN);
    bindMontoInput(document.getElementById('cg-monto'), () => cgOnMontoInput());

    const cats = categoriasParaGasto();
    const selTipo = document.getElementById('cg-tipo');
    // value sin escapeHtml completo: si no, en algunos browsers no matchea el .value =
    selTipo.innerHTML = cats.map(c =>
        `<option value="${String(c.nombre).replace(/"/g, '&quot;')}">${escapeHtml(c.nombre)}</option>`
    ).join('');
    const nombreLista = (listaActual?.nombre || '').trim().toLowerCase();
    const preferida = cats.find(c => c.nombre.toLowerCase() === nombreLista)
        || cats.find(c => /super|verdul|carnic/i.test(c.nombre))
        || cats[0];
    if (preferida) selTipo.value = preferida.nombre;

    const selPagador = document.getElementById('cg-pagador');
    selPagador.innerHTML = participantesCirculo.map(p =>
        `<option value="${p.id}">${escapeHtml(p.nombre)}</option>`
    ).join('');
    if (participantesCirculo[0]) selPagador.value = String(participantesCirculo[0].id);

    document.getElementById('cg-split-container').innerHTML = participantesCirculo.map(p => `
        <div class="split-row">
            <div class="split-name">${escapeHtml(p.nombre)}</div>
            <input type="text" class="split-input input-monto" id="cg-split-${p.id}"
                placeholder="0" inputmode="decimal" autocomplete="off" />
        </div>
    `).join('');
    participantesCirculo.forEach(p => {
        bindMontoInput(document.getElementById('cg-split-' + p.id), () => cgOnSplitInput(p.id));
    });
    document.getElementById('cg-split-total-row').innerHTML = '';
    cgSyncSplitInputsEnabled();

    abrirModal('modal-cargar-gastos');
    setTimeout(() => document.getElementById('cg-concepto').focus(), 120);
}

function cgOnMontoInput() {
    cgSyncSplitInputsEnabled();
    cgRepartirIgual();
}

function cgSyncSplitInputsEnabled() {
    const monto = parseMonto(document.getElementById('cg-monto').value) || 0;
    const enabled = monto > 0;
    participantesCirculo.forEach(p => {
        const input = document.getElementById('cg-split-' + p.id);
        if (!input) return;
        input.disabled = !enabled;
        if (!enabled) {
            input.value = '';
            delete input.dataset.autoResto;
        }
    });
    if (!enabled) document.getElementById('cg-split-total-row').innerHTML = '';
}

function cgRepartirIgual() {
    const monto = parseMonto(document.getElementById('cg-monto').value) || 0;
    const n = participantesCirculo.length;
    if (!monto || !n) return;
    cgSyncSplitInputsEnabled();
    const base = Math.floor((monto / n) * 100) / 100;
    const resto = Math.round((monto - base * n) * 100) / 100;
    participantesCirculo.forEach((p, i) => {
        const input = document.getElementById('cg-split-' + p.id);
        if (!input) return;
        setMontoInput(input, i === 0 ? (base + resto) : base);
        delete input.dataset.autoResto;
    });
    cgUpdateSplitTotal();
}

function cgLimpiarSplit() {
    participantesCirculo.forEach(p => {
        const input = document.getElementById('cg-split-' + p.id);
        if (!input) return;
        input.value = '';
        delete input.dataset.autoResto;
    });
    document.getElementById('cg-split-total-row').innerHTML = '';
}

function cgOnSplitInput(changedId) {
    const monto = parseMonto(document.getElementById('cg-monto').value) || 0;
    if (!(monto > 0)) {
        cgSyncSplitInputsEnabled();
        return;
    }
    aplicarRestoSplit({
        total: monto,
        participantes: participantesCirculo,
        changedId,
        getInput: id => document.getElementById('cg-split-' + id)
    });
    cgUpdateSplitTotal();
}

function cgUpdateSplitTotal() {
    const monto = parseMonto(document.getElementById('cg-monto').value) || 0;
    let total = 0;
    participantesCirculo.forEach(p => {
        total += parseMonto(document.getElementById('cg-split-' + p.id)?.value) || 0;
    });
    total = Math.round(total * 100) / 100;
    const row = document.getElementById('cg-split-total-row');
    if (!monto) { row.innerHTML = ''; return; }
    const ok = Math.abs(total - monto) < 0.02;
    row.innerHTML = `<span class="${ok ? 'text-positive' : 'text-negative'}">Suma: $${fmt(total)} / $${fmt(monto)}</span>`;
}

async function guardarCargarGastos() {
    await withBusyButton('#modal-cargar-gastos .btn-primary', async () => {
        const periodoId = Number(document.getElementById('cg-periodo').value);
        const concepto = document.getElementById('cg-concepto').value.trim();
        const fecha = document.getElementById('cg-fecha').value || hoyISO();
        const monto = parseMonto(document.getElementById('cg-monto').value);
        const tipo = document.getElementById('cg-tipo').value;
        const pagador = Number(document.getElementById('cg-pagador').value);

        if (!periodoId) { alert('Elegí un periodo.'); return; }
        if (!concepto) { alert('Ingresá un concepto.'); return; }
        if (!(monto > 0)) { alert('Ingresá el monto total del ticket.'); return; }
        if (!tipo) { alert('Elegí una categoría.'); return; }
        if (!pagador) { alert('Elegí quién pagó.'); return; }

        const splits = [];
        let totalSplit = 0;
        participantesCirculo.forEach(p => {
            const val = parseMonto(document.getElementById('cg-split-' + p.id)?.value) || 0;
            if (val > 0) {
                splits.push({ id_participante: p.id, monto: val });
                totalSplit += val;
            }
        });
        if (!splits.length) { alert('Distribuí el gasto entre las personas.'); return; }
        if (Math.abs(totalSplit - monto) > 0.05) {
            alert(`La división ($${fmt(totalSplit)}) no cierra con el total ($${fmt(monto)}).`);
            return;
        }

        const { data: gastoData, error: e1 } = await db.from('gastos').insert({
            id_periodo: periodoId,
            id_circulo: circuloId,
            id_pagador: pagador,
            concepto,
            monto,
            tipo_gasto: tipo,
            fecha_gasto: fecha
        }).select().single();
        if (e1 || !gastoData) {
            alert('Error al guardar el gasto: ' + (e1?.message || 'desconocido'));
            return;
        }

        const { error: e2 } = await db.from('gastos_participantes')
            .insert(splits.map(s => ({ ...s, id_gasto: gastoData.id })));
        if (e2) {
            alert('El gasto se creó, pero falló la división: ' + e2.message);
            return;
        }

        cerrarModal('modal-cargar-gastos');
        const periodo = periodosCirculo.find(p => Number(p.id) === periodoId);
        const ir = confirm(
            `Gasto guardado en ${periodo?.nombre || 'el periodo'}.\n¿Querés ir a verlo?`
        );
        if (ir) {
            window.location.href = `./gastos.html?circulo=${circuloId}&periodo=${periodoId}`;
        }
    });
}
