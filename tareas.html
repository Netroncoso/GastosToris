<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1b4079">
    <script>(function(){try{var t=localStorage.getItem('toris-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#1b4079');}catch(e){}})();</script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TorisApp">
    <title>TorisApp • Tareas</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/shared.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="app-booting">
<div id="boot-splash">Cargando...</div>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <button id="btn-back" class="btn-icon" onclick="volverAlCirculo()"><i data-icon="arrow-left" data-size="18"></i></button>
        <h1 id="topbar-title"><i data-icon="check-circle" data-size="20"></i> Tareas</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <span id="topbar-user" class="topbar-user"></span>
        <button class="btn-icon" data-theme-toggle onclick="toggleTheme()" title="Modo oscuro"><i data-icon="moon" data-size="18"></i></button>
        <button class="btn-icon" onclick="cerrarSesion()" title="Cerrar sesión"><i data-icon="arrow-right-on-rectangle" data-size="18"></i></button>
    </div>
</div>

<!-- SCREEN: TAREAS DEL CÍRCULO -->
<div id="screen-grupo" class="screen active">
    <div class="container">
            <div class="filter-tabs">
                <div class="filter-tab active" onclick="setFiltro('pendientes')">Pendientes</div>
                <div class="filter-tab" onclick="setFiltro('todas')">Todas</div>
                <div class="filter-tab" onclick="setFiltro('hechas')">Hechas</div>
            </div>
            <div id="calendar-connect-banner" class="alert alert-info hidden" style="margin-bottom:12px">
                <div style="margin-bottom:8px"><i data-icon="calendar-days" data-size="16"></i> Conectá Google Calendar para sincronizar vencimientos.</div>
                <button class="btn btn-primary btn-sm" type="button" onclick="conectarGoogleCalendar()">Conectar Calendar</button>
            </div>
            <div id="tareas-stats" class="stats-row"></div>
            <div id="tareas-items" class="card"></div>

            <div class="add-item-form mt-12">
                <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Nueva tarea</div>
                <div class="form-group" style="margin-bottom:8px">
                    <input type="text" id="input-titulo-tarea" placeholder="Ej: Pagar el alquiler" class="input-sm"
                        onkeydown="if(event.key==='Enter') agregarTarea()" />
                </div>
                <div class="add-item-row" style="margin-bottom:8px">
                    <select id="input-prioridad-tarea" class="input-sm" style="flex:1">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta</option>
                    </select>
                    <select id="input-asignado-tarea" class="input-sm" style="flex:1">
                        <option value="">Sin asignar</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:8px">
                    <label style="margin-bottom:4px">Vencimiento (opcional — la agrega a Google Calendar)</label>
                    <input type="datetime-local" id="input-fecha-tarea" class="input-sm" />
                </div>
                <div id="section-calendar-invites" style="display:none; margin-bottom:8px; padding:10px; background:var(--border); border-radius:8px; opacity:0.95;">
                    <label style="margin-bottom:6px; font-size:11px; color:var(--muted)">Invitar al calendario:</label>
                    <div id="calendar-invites-list" style="display:flex; flex-direction:column; gap:6px;"></div>
                </div>
                <div class="form-group" style="margin-bottom:0">
                    <label style="margin-bottom:4px">Vincular con una lista (opcional)</label>
                    <select id="input-lista-tarea" class="input-sm">
                        <option value="">Ninguna</option>
                    </select>
                </div>
                <button class="btn btn-primary btn-full mt-12" onclick="agregarTarea()"><i data-icon="plus" data-size="16"></i> Agregar tarea</button>
            </div>

            <button class="btn btn-ghost btn-full mt-12" id="btn-borrar-hechas" onclick="borrarHechas()" style="display:none;color:var(--danger);border-color:var(--danger)">
                <i data-icon="trash" data-size="16"></i> Borrar todas las hechas
            </button>
    </div>
</div>

<!-- MODAL: EDITAR TAREA -->
<div id="modal-editar-tarea" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3><i data-icon="pencil-square" data-size="18"></i> Editar Tarea</h3>
            <button class="modal-close" onclick="cerrarModal('modal-editar-tarea')"><i data-icon="x-mark" data-size="14"></i></button>
        </div>
        <div class="form-group">
            <label>Título</label>
            <input type="text" id="input-edit-titulo-tarea" placeholder="Ej: Pagar el alquiler" />
        </div>
        <div class="add-item-row" style="margin-bottom:12px">
            <div class="form-group" style="flex:1;margin-bottom:0">
                <label>Prioridad</label>
                <select id="input-edit-prioridad-tarea">
                    <option value="baja">Baja</option>
                    <option value="media">Media</option>
                    <option value="alta">Alta</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;margin-bottom:0">
                <label>Asignado</label>
                <select id="input-edit-asignado-tarea">
                    <option value="">Sin asignar</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Vencimiento (opcional — la agrega a Google Calendar)</label>
            <input type="datetime-local" id="input-edit-fecha-tarea" />
        </div>
        <div id="section-edit-calendar-invites" style="display:none; margin-bottom:12px; padding:10px; background:var(--border); border-radius:8px; opacity:0.95;">
            <label style="margin-bottom:6px; font-size:11px; color:var(--muted)">Invitar al calendario:</label>
            <div id="calendar-edit-invites-list" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>
        <div class="form-group">
            <label>Vincular con una lista (opcional)</label>
            <select id="input-edit-lista-tarea">
                <option value="">Ninguna</option>
            </select>
        </div>
        <button class="btn btn-primary btn-full" onclick="guardarEdicionTarea()">Guardar Cambios</button>
    </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
// =============================================
// ESTADO GLOBAL
// =============================================
let grupoActual = null;
let personasTareas = [];
let filtroTareas = 'pendientes';
let todasLasTareas = [];
let listasDisponibles = [];
let userEmail = null;
let tareaEditando = null;
const PRIO_LABEL = { alta: 'Alta', media: 'Media', baja: 'Baja' };

function isoToDatetimeLocal(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 16);
}

requireAuth(async () => {
    const user = await getCurrentUser();
    if (user) userEmail = user.email?.toLowerCase() || null;

    const params = new URLSearchParams(window.location.search);
    const abrirId = params.get('abrir');
    if (!abrirId) {
        window.location.href = './index.html';
        return;
    }

    await syncInvitados({ personsTable: 'participantes', personGroupField: 'id_circulo', membershipTable: 'circulos_miembros', membershipGroupField: 'id_circulo' });

    const { data, error } = await db.from('circulos').select('*').eq('id', abrirId).single();
    if (error || !data) {
        alert('No se encontró ese círculo (o no tenés acceso todavía).');
        window.location.href = './index.html';
        return;
    }
    await abrirGrupo(data, { filtro: params.get('filtro') });
});

// (Sincronización de invitados movida a `js/utils.js` - use `syncInvitados(...)`)

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('input-fecha-tarea').addEventListener('input', actualizarSeccionCalendario);
    document.getElementById('input-fecha-tarea').addEventListener('change', actualizarSeccionCalendario);
    document.getElementById('input-asignado-tarea').addEventListener('change', actualizarCheckboxesPorAsignado);

    document.getElementById('input-edit-fecha-tarea').addEventListener('input', () => actualizarSeccionCalendarioEdit());
    document.getElementById('input-edit-fecha-tarea').addEventListener('change', () => actualizarSeccionCalendarioEdit());
    document.getElementById('input-edit-asignado-tarea').addEventListener('change', actualizarCheckboxesEditPorAsignado);
});

// Navegación: usar las funciones compartidas en `js/utils.js` (`mostrarPantalla`, `cambiarTab`)

const FILTROS_TAREAS = ['pendientes', 'todas', 'hechas'];

async function abrirGrupo(grupo, opts = {}) {
    grupoActual = grupo;
    const filtro = FILTROS_TAREAS.includes(opts.filtro) ? opts.filtro : 'pendientes';
    setQueryParams({ abrir: grupo.id, filtro });
    document.getElementById('topbar-title').textContent = grupo.nombre;
    filtroTareas = filtro;
    document.querySelectorAll('.filter-tab').forEach((t, i) => {
        t.classList.toggle('active', ['pendientes','todas','hechas'][i] === filtro);
    });
    appReady();
    await actualizarEstadoCalendarBanner();
    await Promise.all([cargarPersonasTareas(), cargarTareas(), cargarListasDisponibles()]);
    renderTareas();
}

async function actualizarEstadoCalendarBanner() {
    const banner = document.getElementById('calendar-connect-banner');
    if (!banner) return;
    const ok = await tieneCalendarConectado();
    banner.classList.toggle('hidden', ok);
}

function volverAlCirculo() {
    if (grupoActual) {
        irAlCirculo(grupoActual.id);
    } else {
        irAlInicio();
    }
}
// =============================================
// PARTICIPANTES DEL CÍRCULO (para asignación e invitaciones de calendario)
// =============================================
async function cargarPersonasTareas() {
    const { data, error } = await db.from('participantes')
        .select('*').eq('id_circulo', grupoActual.id).order('nombre');
    personasTareas = data || [];
    if (error) { console.error(error); return; }
    renderSelectAsignado();
}

function renderSelectAsignado() {
    const sel = document.getElementById('input-asignado-tarea');
    let actual = sel.value;

    if (!actual && userEmail) {
        const miPersona = personasTareas.find(p => p.email && p.email.toLowerCase() === userEmail);
        if (miPersona) {
            actual = miPersona.id;
        }
    }

    sel.innerHTML = '<option value="">Sin asignar</option>' +
        personasTareas.map(p => `<option value="${p.id}">${escapeHtml(p.nombre)}</option>`).join('');
    sel.value = actual;

    actualizarCheckboxesPorAsignado();
}

function actualizarCheckboxesPorAsignado() {
    const asignadoVal = document.getElementById('input-asignado-tarea').value;
    const asignadoId = asignadoVal ? parseInt(asignadoVal) : null;
    document.querySelectorAll('.calendar-invite-chk').forEach(chk => {
        const pId = parseInt(chk.getAttribute('data-persona-id'));
        if (pId === asignadoId) {
            chk.checked = true;
        }
    });
}

function actualizarSeccionCalendario() {
    const fechaVal = document.getElementById('input-fecha-tarea').value;
    const div = document.getElementById('section-calendar-invites');
    if (fechaVal) {
        div.style.display = 'block';
        renderCalendarInvitesList();
    } else {
        div.style.display = 'none';
    }
}

function renderCalendarInvitesList() {
    const listCont = document.getElementById('calendar-invites-list');
    if (!listCont) return;

    const conEmail = personasTareas.filter(p => p.email && p.email.trim().length > 0);
    if (!conEmail.length) {
        listCont.innerHTML = '<div style="font-size:12px;color:var(--muted)">Sin participantes con email para invitar.</div>';
        return;
    }

    const asignadoVal = document.getElementById('input-asignado-tarea').value;
    const asignadoId = asignadoVal ? parseInt(asignadoVal) : null;

    listCont.innerHTML = conEmail.map(p => {
        const isAsignado = p.id === asignadoId;
        return `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);text-transform:none;font-weight:normal;cursor:pointer;margin-bottom:0">
                <input type="checkbox" class="calendar-invite-chk" value="${escapeHtml(p.email)}" data-persona-id="${p.id}" ${isAsignado ? 'checked' : ''} style="width:auto;margin:0;cursor:pointer;" />
                <span>${escapeHtml(p.nombre)} (${escapeHtml(p.email)})</span>
            </label>
        `;
    }).join('');
}

// =============================================
// LISTAS DEL CÍRCULO (para vincular una tarea con una lista de compras)
// =============================================
async function cargarListasDisponibles() {
    const { data, error } = await db.from('listas').select('*').eq('id_circulo', grupoActual.id).order('nombre');
    if (error) { console.error(error); return; }
    listasDisponibles = data || [];
    const sel = document.getElementById('input-lista-tarea');
    if (!sel) return;
    const actual = sel.value;
    sel.innerHTML = '<option value="">Ninguna</option>' +
        listasDisponibles.map(l => `<option value="${l.id}">${escapeHtml(l.nombre)}</option>`).join('');
    sel.value = actual;
}

function nombreLista(id) {
    if (!id) return null;
    return listasDisponibles.find(l => l.id === id)?.nombre || null;
}

// =============================================
// TAREAS (escopeadas al grupo de tareas actual)
// =============================================
function setFiltro(f) {
    filtroTareas = f;
    document.querySelectorAll('.filter-tab').forEach((t, i) => {
        t.classList.toggle('active', ['pendientes','todas','hechas'][i] === f);
    });
    if (grupoActual) setQueryParams({ abrir: grupoActual.id, filtro: f });
    renderTareas();
}

async function cargarTareas() {
    const cont = document.getElementById('tareas-items');
    cont.innerHTML = '<div class="loader">Cargando tareas...</div>';
    const { data, error } = await db.from('tareas')
        .select('*').eq('id_circulo', grupoActual.id)
        .order('hecha').order('created_at', { ascending: false });
    if (error) { cont.innerHTML = `<div class="alert alert-error">Error: ${error.message}<br>¿Ejecutaste el SQL de configuración? Ver README.</div>`; return; }
    todasLasTareas = data || [];
    renderTareas();
}

function nombreAsignado(id) {
    if (!id) return null;
    return personasTareas.find(p => p.id === id)?.nombre || null;
}

function renderTareas() {
    const cont = document.getElementById('tareas-items');
    const pendientes = todasLasTareas.filter(t => !t.hecha);
    const hechas     = todasLasTareas.filter(t => t.hecha);

    let items;
    if (filtroTareas === 'pendientes') items = pendientes;
    else if (filtroTareas === 'hechas') items = hechas;
    else items = [...pendientes, ...hechas];

    document.getElementById('tareas-stats').innerHTML =
        `<span>${pendientes.length} pendiente${pendientes.length !== 1 ? 's' : ''}</span>
         <span>${hechas.length} hecha${hechas.length !== 1 ? 's' : ''}</span>`;

    document.getElementById('btn-borrar-hechas').style.display =
        hechas.length > 0 ? 'flex' : 'none';

    if (!items.length) {
        const msgs = { pendientes: '<i data-icon="check-circle" data-size="18"></i> No hay tareas pendientes.', hechas: 'Sin tareas hechas todavía.', todas: '<i data-icon="clipboard-document-list" data-size="18"></i> No hay tareas en este grupo. Agregá una.' };
        cont.innerHTML = `<div class="empty" style="padding:24px"><span class="empty-icon">${filtroTareas === 'pendientes' ? icon('check-circle',40) : icon('clipboard-document-list',40)}</span>${msgs[filtroTareas]}</div>`;
        return;
    }

    cont.innerHTML = items.map(t => {
        const asignado = nombreAsignado(t.id_asignado);
        const lista = nombreLista(t.id_lista);
        const tieneBadges = t.fecha_vencimiento || lista || asignado;
        return `
        <div class="tarea-item ${t.hecha ? 'comprado' : ''}" id="tarea-${t.id}">
            <div class="tarea-item-main">
                <div class="lista-check ${t.hecha ? 'checked' : ''}" onclick="toggleTarea(${t.id}, ${t.hecha})">
                    ${t.hecha ? icon('check',14) : ''}
                </div>
                <div class="prio-dot prio-${t.prioridad || 'media'}" title="Prioridad ${PRIO_LABEL[t.prioridad] || 'Media'}"></div>
                <div class="lista-nombre ${t.hecha ? 'tachado' : ''}">${escapeHtml(t.titulo)}</div>
                <div class="tarea-actions">
                    <button class="btn-icon-plain" onclick="abrirModalEditarTarea(${t.id})" title="Editar tarea">${icon('pencil-square',18)}</button>
                    <button class="btn-icon-plain btn-icon-danger" onclick="borrarTarea(${t.id})" title="Eliminar tarea">${icon('x-mark',18)}</button>
                </div>
            </div>
            ${tieneBadges ? `
            <div class="tarea-item-badges">
                ${t.fecha_vencimiento ? `<span class="badge badge-purple" title="${t.google_event_id ? 'Sincronizada con Google Calendar' : 'Vencimiento'}"><i data-icon="calendar-days" data-size="14"></i> ${formatFechaHora(t.fecha_vencimiento)}</span>` : ''}
                ${lista ? `<a href="listas.html?circulo=${grupoActual.id}&abrir=${t.id_lista}" class="badge badge-green" style="text-decoration:none"><i data-icon="shopping-cart" data-size="14"></i> ${escapeHtml(lista)}</a>` : ''}
                ${asignado ? `<span class="badge badge-blue">${escapeHtml(asignado)}</span>` : ''}
            </div>` : ''}
        </div>`;
    }).join('');
}

async function agregarTarea() {
    await withBusyButton('.add-item-form .btn-primary', async () => {
    const titulo = document.getElementById('input-titulo-tarea').value.trim();
    const prioridad = document.getElementById('input-prioridad-tarea').value;
    const asignadoVal = document.getElementById('input-asignado-tarea').value;
    const listaVal = document.getElementById('input-lista-tarea').value;
    const fechaVal = document.getElementById('input-fecha-tarea').value; // "YYYY-MM-DDTHH:mm" en hora local, o ""
    const id_asignado = asignadoVal ? parseInt(asignadoVal) : null;
    const id_lista = listaVal ? parseInt(listaVal) : null;
    const fecha_vencimiento = fechaVal ? new Date(fechaVal).toISOString() : null;
    if (!titulo) { document.getElementById('input-titulo-tarea').focus(); return; }

    const invitadosEmails = [];
    if (fecha_vencimiento) {
        document.querySelectorAll('.calendar-invite-chk:checked').forEach(chk => {
            invitadosEmails.push(chk.value);
        });
    }

    const { data, error } = await db.from('tareas')
        .insert({ titulo, prioridad, id_asignado, id_lista, id_circulo: grupoActual.id, fecha_vencimiento, invitados_calendar: invitadosEmails }).select().single();
    if (error) { alert('Error: ' + error.message); return; }

    document.getElementById('input-titulo-tarea').value = '';
    document.getElementById('input-fecha-tarea').value = '';
    document.getElementById('input-asignado-tarea').value = '';
    document.getElementById('input-prioridad-tarea').value = 'media';
    renderSelectAsignado();
    actualizarSeccionCalendario();
    document.getElementById('input-titulo-tarea').focus();

    todasLasTareas = [data, ...todasLasTareas];
    todasLasTareas.sort((a, b) => a.hecha - b.hecha || new Date(b.created_at) - new Date(a.created_at));
    renderTareas();

    if (fecha_vencimiento) {
        try {
            const asignadoEmail = personasTareas.find(p => p.id === id_asignado)?.email || null;
            const resultado = await callCalendarSync({
                action: 'create',
                titulo,
                fecha_vencimiento,
                asignado_email: asignadoEmail,
                invitados_emails: invitadosEmails
            });
            await db.from('tareas').update({ google_event_id: resultado.event_id }).eq('id', data.id);
            const t = todasLasTareas.find(x => x.id === data.id);
            if (t) t.google_event_id = resultado.event_id;
            renderTareas();
            await actualizarEstadoCalendarBanner();
        } catch (e) {
            await manejarErrorCalendar(e, 'La tarea se creó, pero no se pudo agregar a Google Calendar');
        }
    }
    });
}

async function toggleTarea(id, estaHecha) {
    const nuevoEstado = !estaHecha;
    const { error } = await db.from('tareas').update({
        hecha: nuevoEstado,
        hecha_at: nuevoEstado ? new Date().toISOString() : null
    }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    const tarea = todasLasTareas.find(t => t.id === id);
    if (tarea) { tarea.hecha = nuevoEstado; tarea.hecha_at = nuevoEstado ? new Date().toISOString() : null; }
    renderTareas();
}

async function borrarTarea(id) {
    const tarea = todasLasTareas.find(t => t.id === id);
    if (tarea?.google_event_id) {
        try {
            await callCalendarSync({ action: 'delete', event_id: tarea.google_event_id });
        } catch (e) {
            console.error('No se pudo borrar el evento de Google Calendar:', e.message);
        }
    }
    const { error } = await db.from('tareas').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    todasLasTareas = todasLasTareas.filter(t => t.id !== id);
    renderTareas();
}

async function borrarHechas() {
    if (!(await torisConfirm({
        title: 'Borrar tareas hechas',
        message: '¿Borrar todas las tareas hechas de este grupo?',
        confirmLabel: 'Borrar',
        danger: true
    }))) return;
    const ids = todasLasTareas.filter(t => t.hecha).map(t => t.id);
    const { error } = await db.from('tareas').delete().in('id', ids);
    if (error) { alert('Error: ' + error.message); return; }
    todasLasTareas = todasLasTareas.filter(t => !t.hecha);
    renderTareas();
}

// =============================================
// EDITAR TAREA
// =============================================
function actualizarCheckboxesEditPorAsignado() {
    const asignadoVal = document.getElementById('input-edit-asignado-tarea').value;
    const asignadoId = asignadoVal ? parseInt(asignadoVal) : null;
    document.querySelectorAll('.calendar-edit-invite-chk').forEach(chk => {
        const pId = parseInt(chk.getAttribute('data-persona-id'));
        if (pId === asignadoId) chk.checked = true;
    });
}

function actualizarSeccionCalendarioEdit(invitadosGuardados = null) {
    const fechaVal = document.getElementById('input-edit-fecha-tarea').value;
    const div = document.getElementById('section-edit-calendar-invites');
    if (fechaVal) {
        div.style.display = 'block';
        renderCalendarInvitesListEdit(invitadosGuardados);
    } else {
        div.style.display = 'none';
    }
}

function renderCalendarInvitesListEdit(invitadosGuardados = null) {
    const listCont = document.getElementById('calendar-edit-invites-list');
    if (!listCont) return;

    const conEmail = personasTareas.filter(p => p.email && p.email.trim().length > 0);
    if (!conEmail.length) {
        listCont.innerHTML = '<div style="font-size:12px;color:var(--muted)">Sin participantes con email para invitar.</div>';
        return;
    }

    const asignadoVal = document.getElementById('input-edit-asignado-tarea').value;
    const asignadoId = asignadoVal ? parseInt(asignadoVal) : null;
    const invitadosSet = invitadosGuardados
        ? new Set(invitadosGuardados.map(e => e.toLowerCase()))
        : null;

    listCont.innerHTML = conEmail.map(p => {
        const emailLower = p.email.toLowerCase();
        const isAsignado = p.id === asignadoId;
        const isChecked = invitadosSet
            ? invitadosSet.has(emailLower) || isAsignado
            : isAsignado;
        return `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);text-transform:none;font-weight:normal;cursor:pointer;margin-bottom:0">
                <input type="checkbox" class="calendar-edit-invite-chk" value="${escapeHtml(p.email)}" data-persona-id="${p.id}" ${isChecked ? 'checked' : ''} style="width:auto;margin:0;cursor:pointer;" />
                <span>${escapeHtml(p.nombre)} (${escapeHtml(p.email)})</span>
            </label>
        `;
    }).join('');
}

function abrirModalEditarTarea(id) {
    const tarea = todasLasTareas.find(t => t.id === id);
    if (!tarea) return;
    tareaEditando = id;

    document.getElementById('input-edit-titulo-tarea').value = tarea.titulo || '';
    document.getElementById('input-edit-prioridad-tarea').value = tarea.prioridad || 'media';

    const selAsignado = document.getElementById('input-edit-asignado-tarea');
    selAsignado.innerHTML = '<option value="">Sin asignar</option>' +
        personasTareas.map(p => `<option value="${p.id}">${escapeHtml(p.nombre)}</option>`).join('');
    selAsignado.value = tarea.id_asignado || '';

    document.getElementById('input-edit-fecha-tarea').value = isoToDatetimeLocal(tarea.fecha_vencimiento);

    const selLista = document.getElementById('input-edit-lista-tarea');
    selLista.innerHTML = '<option value="">Ninguna</option>' +
        listasDisponibles.map(l => `<option value="${l.id}">${escapeHtml(l.nombre)}</option>`).join('');
    selLista.value = tarea.id_lista || '';

    actualizarSeccionCalendarioEdit(tarea.invitados_calendar || []);
    abrirModal('modal-editar-tarea');
    setTimeout(() => document.getElementById('input-edit-titulo-tarea').focus(), 100);
}

async function guardarEdicionTarea() {
    const tarea = todasLasTareas.find(t => t.id === tareaEditando);
    if (!tarea) return;

    const titulo = document.getElementById('input-edit-titulo-tarea').value.trim();
    const prioridad = document.getElementById('input-edit-prioridad-tarea').value;
    const asignadoVal = document.getElementById('input-edit-asignado-tarea').value;
    const listaVal = document.getElementById('input-edit-lista-tarea').value;
    const fechaVal = document.getElementById('input-edit-fecha-tarea').value;
    const id_asignado = asignadoVal ? parseInt(asignadoVal) : null;
    const id_lista = listaVal ? parseInt(listaVal) : null;
    const fecha_vencimiento = fechaVal ? new Date(fechaVal).toISOString() : null;

    if (!titulo) { document.getElementById('input-edit-titulo-tarea').focus(); return; }

    const invitadosEmails = [];
    if (fecha_vencimiento) {
        document.querySelectorAll('.calendar-edit-invite-chk:checked').forEach(chk => {
            invitadosEmails.push(chk.value);
        });
    }

    const { error } = await db.from('tareas').update({
        titulo, prioridad, id_asignado, id_lista, fecha_vencimiento,
        invitados_calendar: invitadosEmails
    }).eq('id', tareaEditando);
    if (error) { alert('Error: ' + error.message); return; }

    const hadEvent = tarea.google_event_id;
    let nuevoEventId = hadEvent;

    try {
        if (fecha_vencimiento && hadEvent) {
            const asignadoEmail = personasTareas.find(p => p.id === id_asignado)?.email || null;
            await callCalendarSync({
                action: 'update',
                event_id: hadEvent,
                titulo,
                fecha_vencimiento,
                asignado_email: asignadoEmail,
                invitados_emails: invitadosEmails
            });
        } else if (fecha_vencimiento && !hadEvent) {
            const asignadoEmail = personasTareas.find(p => p.id === id_asignado)?.email || null;
            const resultado = await callCalendarSync({
                action: 'create',
                titulo,
                fecha_vencimiento,
                asignado_email: asignadoEmail,
                invitados_emails: invitadosEmails
            });
            nuevoEventId = resultado.event_id;
            await db.from('tareas').update({ google_event_id: nuevoEventId }).eq('id', tareaEditando);
        } else if (!fecha_vencimiento && hadEvent) {
            await callCalendarSync({ action: 'delete', event_id: hadEvent });
            nuevoEventId = null;
            await db.from('tareas').update({ google_event_id: null }).eq('id', tareaEditando);
        }
    } catch (e) {
        await manejarErrorCalendar(e, 'La tarea se guardó, pero hubo un problema con Google Calendar');
    }

    Object.assign(tarea, {
        titulo, prioridad, id_asignado, id_lista, fecha_vencimiento,
        invitados_calendar: invitadosEmails,
        google_event_id: nuevoEventId
    });

    tareaEditando = null;
    cerrarModal('modal-editar-tarea');
    renderTareas();
}
</script>
